<style>




/*==================================================
               GLOBAL
==================================================*/




*{
   margin:0;
   padding:0;
   box-sizing:border-box;
   font-family:'Poppins',sans-serif;
}




html,body{
   width:100%;
   height:100%;
   overflow:hidden;
   background:#EEF3FB;
}




/* Scrollbar */




::-webkit-scrollbar{
   width:8px;
}




::-webkit-scrollbar-track{
   background:#edf2f8;
}




::-webkit-scrollbar-thumb{
   background:#b8c3d9;
   border-radius:20px;
}




::-webkit-scrollbar-thumb:hover{
   background:#8c99b3;
}




/*==================================================
               DASHBOARD LAYOUT
==================================================*/




.dashboard{




   display:flex;




   width:100%;




   height:100vh;




   overflow:hidden;




}




/*==================================================
               SIDEBAR
==================================================*/




.sidebar{




   width:270px;




   min-width:270px;




   background:#2E2278;




   color:#fff;




   display:flex;




   flex-direction:column;




   justify-content:space-between;




   transition:.3s;




   box-shadow:5px 0 20px rgba(0,0,0,.08);




}




/* Logo */




.logo{




   padding:28px;




   font-size:24px;




   font-weight:700;




   display:flex;




   align-items:center;




   gap:12px;




   border-bottom:1px solid rgba(255,255,255,.08);




}




.logo i{




   color:#E1A855;




}




/*==================================================
               USER CARD
==================================================*/




.user-card{




   text-align:center;




   padding:25px;




}




.avatar{




   width:75px;




   height:75px;




   border-radius:50%;




   background:#E1A855;




   color:#fff;




   font-size:34px;




   font-weight:700;




   display:flex;




   align-items:center;




   justify-content:center;




   margin:auto;




   margin-bottom:15px;




   box-shadow:0 8px 20px rgba(0,0,0,.18);




}




.user-card h3{




   font-size:19px;




   margin-bottom:5px;




}




.user-card p{




   font-size:14px;




   color:#cfd4ff;




}




/*==================================================
               MENU
==================================================*/




.menu{




   list-style:none;




   padding:10px;




}




.menu li{




   display:flex;




   align-items:center;




   gap:15px;




   padding:14px 18px;




   margin-bottom:8px;




   border-radius:12px;




   cursor:pointer;




   transition:.3s;




   font-size:15px;




}




.menu li i{




   width:22px;




   text-align:center;




   font-size:18px;




}




.menu li:hover{




   background:rgba(255,255,255,.12);




}




.menu li.active{




   background:#E1A855;




   color:#fff;




   box-shadow:0 10px 25px rgba(225,168,85,.35);




}




/*==================================================
               LOGOUT
==================================================*/




.sidebar-bottom{




   padding:20px;




}




#logoutBtn{




   width:100%;




   border:none;




   background:#d63031;




   color:white;




   padding:14px;




   border-radius:12px;




   cursor:pointer;




   font-size:15px;




   transition:.3s;




}




#logoutBtn:hover{




   background:#c0392b;




}




/*==================================================
               MAIN
==================================================*/




.main{




   flex:1;




   display:flex;




   flex-direction:column;




   overflow:hidden;




}




/*==================================================
               HEADER
==================================================*/




.topbar{




   height:75px;




   background:white;




   display:flex;




   justify-content:space-between;




   align-items:center;




   padding:0 30px;




   box-shadow:0 5px 18px rgba(0,0,0,.06);




   z-index:10;




}




.topbar-left{




   display:flex;




   align-items:center;




   gap:20px;




}




.menu-btn{




   width:45px;




   height:45px;




   border:none;




   border-radius:10px;




   background:#EEF3FB;




   cursor:pointer;




   font-size:18px;




   transition:.3s;




}




.menu-btn:hover{




   background:#2E2278;




   color:white;




}




.topbar-left h2{




   color:#2E2278;




   font-size:26px;




}




.topbar-right{




   display:flex;




   align-items:center;




   gap:25px;




}




.dateTime{




   color:#555;




   font-size:14px;




}




.notification{




   position:relative;




   font-size:22px;




   color:#2E2278;




   cursor:pointer;




}




.badge{




   position:absolute;




   top:-8px;




   right:-10px;




   width:18px;




   height:18px;




   border-radius:50%;




   background:red;




   color:white;




   font-size:11px;




   display:flex;




   justify-content:center;




   align-items:center;




}




.welcome{




   font-size:15px;




   color:#444;




}




.welcome b{




   color:#2E2278;




}




/*==================================================
               CONTENT
==================================================*/




#content{




   flex:1;




   overflow:auto;




   padding:30px;




}




/*==================================================
           DASHBOARD HOME
==================================================*/




.dashboard-home{




   display:flex;




   flex-direction:column;




   gap:30px;




   width:100%;




}




/*==================================================
           STATISTICS GRID
==================================================*/




.stats-grid{




   display:grid;




   grid-template-columns:repeat(4,1fr);




   gap:22px;




}




/*==================================================
           STAT CARD
==================================================*/




.stat-card{




   background:white;




   border-radius:18px;




   padding:22px;




   display:flex;




   align-items:center;




   justify-content:space-between;




   box-shadow:0 12px 28px rgba(0,0,0,.06);




   transition:.35s;




   cursor:pointer;




}
/*****************************************
       ACTIVE STAT CARD
******************************************/




.stat-card.active{




   border:2px solid #2E2278;




   box-shadow:0 8px 20px rgba(46,34,120,.25);




   transform:translateY(-3px);




}




.stat-card:hover{




   transform:translateY(-6px);




   box-shadow:0 18px 35px rgba(0,0,0,.10);




}




.stat-card .icon{




   width:65px;




   height:65px;




   border-radius:16px;




   display:flex;




   justify-content:center;




   align-items:center;




   color:white;




   font-size:28px;




}




.stat-card h3{




   font-size:30px;




   color:#222;




}




.stat-card p{




   color:#666;




   margin-top:4px;




}




/*==================================================
           CARD COLORS
==================================================*/




.blue .icon{
background:#3498db;
}




.red .icon{
background:#e74c3c;
}




.green .icon{
background:#2ecc71;
}




.orange .icon{
background:#f39c12;
}




.purple .icon{
background:#8e44ad;
}




.cyan .icon{
background:#16a085;
}




.pink .icon{
background:#e84393;
}




.dark .icon{
background:#2d3436;
}
/*==================================================
               DASHBOARD ROW
==================================================*/




.dashboard-row{




   display:grid;




   grid-template-columns:2fr 1fr;




   gap:25px;




}




/*==================================================
               DASHBOARD BOX
==================================================*/




.dashboard-box{




   background:white;




   border-radius:20px;




   padding:25px;




   box-shadow:0 12px 28px rgba(0,0,0,.06);




   transition:.35s;




}




.dashboard-box:hover{




   transform:translateY(-5px);




   box-shadow:0 18px 35px rgba(0,0,0,.10);




}




.dashboard-box h3{




   display:flex;




   align-items:center;




   gap:10px;




   color:#2E2278;




   font-size:20px;




   margin-bottom:20px;




}




.dashboard-box h3 i{




   color:#E1A855;




}




/*==================================================
               CHART AREA
==================================================*/




#ticketChart,
#techChart{




   width:100%;




   height:320px;




   border-radius:15px;




   background:linear-gradient(
       135deg,
       #f8f9ff,
       #eef3fb
   );




   border:2px dashed #d8deef;




   display:flex;




   justify-content:center;




   align-items:center;




   color:#7d8aa6;




   font-size:18px;




}




/*==================================================
               RECENT TICKETS
==================================================*/




#recentTickets{




   width:100%;




   min-height:350px;




   border-radius:15px;




   background:linear-gradient(
       135deg,
       #f8f9ff,
       #eef3fb
   );




   border:2px dashed #d8deef;




   display:flex;




   justify-content:center;




   align-items:center;




   color:#7d8aa6;




   font-size:18px;




}




/*==================================================
               ANIMATION
==================================================*/




@keyframes fadeUp{




   from{




       opacity:0;




       transform:translateY(25px);




   }




   to{




       opacity:1;




       transform:translateY(0);




   }




}




.stat-card{




   animation:fadeUp .6s ease;




}




.dashboard-box{




   animation:fadeUp .8s ease;




}




/*==================================================
               RESPONSIVE
==================================================*/




@media(max-width:1400px){




.stats-grid{




grid-template-columns:repeat(2,1fr);




}




.dashboard-row{




grid-template-columns:1fr;




}




}




@media(max-width:900px){




.sidebar{




width:85px;




min-width:85px;




}




.logo span,
.user-card h3,
.user-card p,
.menu span,
#logoutBtn{




display:none;




}




.menu li{




justify-content:center;




}




.avatar{




width:55px;




height:55px;




font-size:22px;




}




.stats-grid{




grid-template-columns:1fr;




}




.topbar{




padding:0 15px;




}




.topbar h2{




font-size:22px;




}




.dateTime{




display:none;




}




}
./* ==========================================
  Dashboard Filter Bar
========================================== */
.dashboard-filter{




   display:flex;
   align-items:center;
   gap:12px;




   width:100%;
   max-width:100%;




   background:#fff;
   padding:14px 20px;
   border-radius:16px;
   box-shadow:0 6px 20px rgba(0,0,0,.08);
   margin-bottom:25px;




   flex-wrap:nowrap;      /* keep everything on one line */
}
.auto-refresh{




   margin-left:auto;




   display:flex;
   align-items:center;
   gap:8px;




   white-space:nowrap;




   font-size:14px;
   font-weight:600;
   color:#2E2278;




}




#refreshCountdown{




   color:#E67E22;




   font-weight:700;




   min-width:45px;




}




.filter-input,
.filter-select{




   height:42px;




   border:1px solid #ddd;




   border-radius:10px;




   padding:0 14px;




   font-size:14px;




   outline:none;




}




.filter-input{




   width:160px;




}




.filter-select{




   width:220px;




}




.filter-input:focus,
.filter-select:focus{




   border-color:#2E2278;




}




.filter-btn{




   height:42px;




   padding:0 22px;




   border:none;




   border-radius:10px;




   background:#2E2278;




   color:#fff;




   font-weight:600;




   cursor:pointer;




   transition:.3s;




}




.filter-btn:hover{




   background:#20185f;




}




.refresh-btn{




   width:42px;




   height:42px;




   border:none;




   border-radius:10px;




   background:#E1A855;




   color:#fff;




   cursor:pointer;




   transition:.3s;




}




.refresh-btn:hover{




   background:#cb8d31;




}
/* ==========================================
  RECENT TICKETS TABLE
========================================== */




.recent-ticket-table{




   width:100%;




   border-collapse:collapse;




   margin-top:15px;




   font-size:14px;




}




.recent-ticket-table thead{




   background:#2E2278;




   color:#fff;




}




.recent-ticket-table th{




   padding:14px 12px;




   text-align:left;




   font-weight:600;




}




.recent-ticket-table td{




   padding:12px;




   border-bottom:1px solid #ececec;




   vertical-align:middle;




}




.recent-ticket-table tbody tr{




   transition:.25s;




}




.recent-ticket-table tbody tr:hover{




   background:#f7f8fd;




}




.recent-ticket-table td:nth-child(7){




   max-width:260px;




   white-space:nowrap;




   overflow:hidden;




   text-overflow:ellipsis;




}
/* ==========================================
   RECENT TICKET ACTION BUTTONS
========================================== */

.recent-ticket-actions{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    white-space:nowrap;

}


/* Common action button */

.recent-action-btn{

    width:38px;

    height:38px;

    min-width:38px;

    padding:0;

    border:none;

    border-radius:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    color:#fff;

    font-size:14px;

    transition:all .25s ease;

}


/* View */

.recent-action-btn.view-btn{

    background:#3498DB;

}


.recent-action-btn.view-btn:hover{

    background:#2478B5;

    transform:translateY(-2px);

    box-shadow:0 5px 12px rgba(52,152,219,.25);

}


/* Update */

.recent-action-btn.update-btn{

    background:#E1A855;

}


.recent-action-btn.update-btn:hover{

    background:#C98D2D;

    transform:translateY(-2px);

    box-shadow:0 5px 12px rgba(225,168,85,.30);

}


/* Action column */

.recent-ticket-table th:last-child,
.recent-ticket-table td:last-child{

    width:110px;

    min-width:110px;

    text-align:center;

    white-space:nowrap;

}
/* ==========================================
  TICKET DETAILS MODAL
========================================== */




.ticket-modal{




   display:none;




   position:fixed;




   left:0;




   top:0;




   width:100%;




   height:100%;




   background:rgba(0,0,0,.55);




   z-index:9999;




   justify-content:center;




   align-items:center;




   animation:fadeIn .25s ease;




}




.ticket-modal-content{




   width:90%;




   max-width:1100px;




   max-height:90vh;




   overflow-y:auto;




   background:#fff;




   border-radius:18px;




   box-shadow:0 15px 40px rgba(0,0,0,.25);




}




.ticket-modal-header{




   display:flex;




   justify-content:space-between;




   align-items:center;




   padding:20px 25px;




   background:#2E2278;




   color:#fff;




   border-radius:18px 18px 0 0;




}




.ticket-modal-header h2{




   margin:0;




   font-size:22px;




   font-weight:600;




}




#closeTicketModal{




   font-size:30px;




   cursor:pointer;




   transition:.3s;




}




#closeTicketModal:hover{




   transform:rotate(90deg);




}




#ticketDetails{




   padding:25px;




}




@keyframes fadeIn{




   from{




       opacity:0;




   }




   to{




       opacity:1;




   }




}
/*==========================================
       NEW TICKET DETAILS DESIGN
==========================================*/




.ticket-wrapper{
   padding:10px;
}




.ticket-top{
   display:flex;
   justify-content:space-between;
   align-items:center;
   padding-bottom:20px;
   margin-bottom:25px;
   border-bottom:2px solid #edf1f7;
}




.ticket-top h2{
   font-size:26px;
   color:#2E2278;
   margin-bottom:5px;
   font-weight:700;
}




.ticket-top p{
   color:#666;
   font-size:15px;
}




.status-badge{




   display:inline-block;




   padding:10px 20px;




   border-radius:30px;




   background:#2ecc71;




   color:#fff;




   font-weight:600;




   font-size:14px;




   text-transform:uppercase;




   letter-spacing:.5px;
}




.ticket-grid{




   display:grid;




   grid-template-columns:repeat(2,1fr);




   gap:22px;
}




.ticket-card{




   background:#fafbff;




   border:1px solid #e4e9f4;




   border-radius:16px;




   padding:20px;




   transition:.3s;




   box-shadow:0 5px 18px rgba(0,0,0,.05);




}




.ticket-card:hover{




   transform:translateY(-3px);




   box-shadow:0 12px 25px rgba(0,0,0,.08);




}




.ticket-card h3{




   color:#2E2278;




   margin-bottom:18px;




   font-size:18px;




   display:flex;




   align-items:center;




   gap:10px;
}




.ticket-card h3 i{




   color:#E1A855;
}




.ticket-card p{




   display:flex;




   justify-content:space-between;




   align-items:center;




   margin:12px 0;




   font-size:15px;




   color:#444;




   border-bottom:1px dashed #ececec;




   padding-bottom:8px;




}




.ticket-card p:last-child{




   border-bottom:none;
}




.ticket-card b{




   color:#2E2278;




   min-width:120px;
}




@media(max-width:900px){




.ticket-grid{




grid-template-columns:1fr;




}




.ticket-top{




flex-direction:column;




align-items:flex-start;




gap:15px;




}




}
/*==========================================
       FULL WIDTH CARD
==========================================*/




.full-card{




   margin-top:25px;




   background:#fafbff;




   border:1px solid #e4e9f4;




   border-radius:16px;




   padding:22px;




   box-shadow:0 5px 18px rgba(0,0,0,.05);




}




.full-card h3{




   color:#2E2278;




   margin-bottom:15px;




   display:flex;




   align-items:center;




   gap:10px;




}




.full-card h3 i{




   color:#E1A855;




}




.problem-box,
.remarks-box{




   background:white;




   border-radius:12px;




   padding:18px;




   border-left:5px solid #2E2278;




   line-height:1.8;




   color:#444;




}












/*==========================================
       FOOTER
==========================================*/




.ticket-footer{




   margin-top:30px;




   display:flex;




   justify-content:flex-end;




   gap:15px;




   flex-wrap:wrap;




}




.ticket-btn{




   border:none;




   padding:12px 22px;




   border-radius:10px;




   color:#fff;




   cursor:pointer;




   font-size:14px;




   font-weight:600;




   transition:.3s;




}




.ticket-btn:hover{




   transform:translateY(-2px);




}




.print-btn{




   background:#3498db;




}




.pdf-btn{




   background:#e74c3c;




}




.email-btn{




   background:#16a085;




}




.close-btn{




   background:#2E2278;




}
/*****************************************
           NO DATA
******************************************/




.no-data{




   padding:40px;




   text-align:center;




   font-size:18px;




   color:#777;




   font-weight:600;




}




.no-data i{




   font-size:45px;




   color:#2E2278;




   margin-bottom:10px;




}
/*****************************************
       AUTO REFRESH TIMER
******************************************/




.refresh-area{




   display:flex;
   align-items:center;
   gap:10px;
   margin-left:auto;




}




.auto-refresh{




   display:flex;
   align-items:center;
   gap:6px;
   white-space:nowrap;




}




</style>
