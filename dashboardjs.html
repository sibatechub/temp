function getSessionToken() {

}

/*==================================================
               LOGOUT
==================================================*/

const LOGIN_PAGE_URL =
    "https://script.google.com/macros/s/AKfycbzyj-bOwS0M0Mg_-vxtKTBtHrEasHMzxBpWigB5-MQ/dev";


document.getElementById("logoutBtn").onclick = function(){

    Swal.fire({

        title: "Logout",

        text: "Do you really want to logout?",

        icon: "question",

        showCancelButton: true,

        confirmButtonColor: "#2E2278",

        cancelButtonColor: "#999",

        confirmButtonText: "Yes, Logout",

        cancelButtonText: "Cancel",

        heightAuto: false,

        scrollbarPadding: false

    }).then(function(result){

        if(!result.isConfirmed){

            return;

        }


        /*
         * Disable logout button
         */

        const logoutBtn =
            document.getElementById("logoutBtn");

        logoutBtn.disabled = true;


        /*
         * Logout from server
         */

        google.script.run

            .withSuccessHandler(function(){

                /*
                 * Clear browser session
                 */

                sessionStorage.removeItem(
                    "sessionToken"
                );

                localStorage.removeItem(
                    "sessionToken"
                );


                /*
                 * Redirect to Login Page
                 */

                window.top.location.replace(
                    LOGIN_PAGE_URL
                );

            })

            .withFailureHandler(function(error){

                console.error(
                    "Logout error:",
                    error
                );


                /*
                 * Even if server logout
                 * gives an error, clear
                 * local session and return
                 * to login page.
                 */

                sessionStorage.removeItem(
                    "sessionToken"
                );

                localStorage.removeItem(
                    "sessionToken"
                );


                window.top.location.replace(
                    LOGIN_PAGE_URL
                );

            })

            .logoutUser(
                getSessionToken()
            );

    });

};

/*************************************************
* AUTO REFRESH COUNTDOWN
*************************************************/




let refreshTime = 60;




function startAutoRefresh(){




   updateCountdown();




   setInterval(function(){




       refreshTime--;




       updateCountdown();




       if(refreshTime == 0){




           refreshDashboard();




           refreshTime = 60;




           updateCountdown();




       }




   },1000);




}




function updateCountdown(){




   const min = String(Math.floor(refreshTime / 60)).padStart(2,"0");




   const sec = String(refreshTime % 60).padStart(2,"0");




   document.getElementById("refreshCountdown").innerHTML =
       `${min}:${sec}`;




}
function filterByStatus(type){




   dashboardFilter.status = "";
   dashboardFilter.priority = "";




   clearActiveCards();




   switch(type){




       case "TOTAL":
           setActiveCard("cardTotal");
           break;




       case "OPEN":
           dashboardFilter.status="OPEN";
           setActiveCard("cardOpen");
           break;




       case "IMMEDIATE":
           dashboardFilter.priority="IMMEDIATE";
           setActiveCard("cardImmediate");
           break;




       case "ACCEPTED":
           dashboardFilter.status="ACCEPTED";
           setActiveCard("cardAccepted");
           break;




       case "PENDING":
           dashboardFilter.status="PENDING";
           setActiveCard("cardPending");
           break;




       case "REOPEN":
           dashboardFilter.status="REOPEN";
           setActiveCard("cardReopen");
           break;




       case "CLOSED":
           dashboardFilter.status="CLOSED";
           setActiveCard("cardClosed");
           break;




   }




   refreshDashboard();




}

function clearActiveCards(){




   const cards = document.querySelectorAll(".stat-card");




   cards.forEach(function(card){

}
function setActiveCard(cardId){




   clearActiveCards();




   document.getElementById(cardId).classList.add("active");




}
