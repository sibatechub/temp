<style>

/* =====================================================
   COMPUTER MANAGEMENT
===================================================== */

#computerManagementPage,
#computerManagementPage * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


#computerManagementPage {
  width: 100%;
  min-height: 100%;
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;

  background: #f5f7fb;
  color: #1e293b;
}


#computerManagementPage .computer-management-container {
  width: 100%;
  padding: 22px;
}


/* =====================================================
   PAGE HEADER
===================================================== */

#computerManagementPage .cm-page-top {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;

  margin-bottom: 22px;

}


#computerManagementPage .page-header h2 {

  font-size: 26px;

  font-weight: 700;

  color: #172554;

  margin-bottom: 6px;

}


#computerManagementPage .page-header h2 i {

  color: #2563eb;

  margin-right: 8px;

}


#computerManagementPage .page-header p {

  font-size: 14px;

  color: #64748b;

}


#computerManagementPage .cm-header-btn {

  background: #1e3a8a;

  color: white;

  border: none;

  border-radius: 8px;

  padding: 10px 18px;

  cursor: pointer;

  font-weight: 600;

}


#computerManagementPage .cm-header-btn:hover {

  background: #172554;

}


/* ==========================================
   COMPUTER MANAGEMENT - LOADING
========================================== */

#computerManagementPage #cmLoadingOverlay {

  position: fixed;

  top: 90px;
  right: 25px;

  display: none;

  align-items: center;
  justify-content: center;

  z-index: 99999;

  pointer-events: none;

}


#computerManagementPage .cm-loading-box {

  display: flex;

  align-items: center;

  gap: 14px;

  padding: 14px 20px;

  background: #ffffff;

  border-radius: 12px;

  border: 1px solid #e5e7eb;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.15);

  animation:
    cmLoadingSlide 0.3s ease;

}


#computerManagementPage .cm-spinner {

  width: 24px;
  height: 24px;

  border: 3px solid #dbeafe;

  border-top-color: #2563eb;

  border-radius: 50%;

  animation:
    cmSpin 0.8s linear infinite;

}


#computerManagementPage .cm-loading-content {

  display: flex;

  flex-direction: column;

  gap: 3px;

}


#computerManagementPage #cmLoadingText {

  font-size: 14px;

  font-weight: 600;

  color: #172554;

}


#computerManagementPage .cm-loading-content small {

  font-size: 12px;

  color: #64748b;

}


@keyframes cmSpin {

  to {

    transform:
      rotate(360deg);

  }

}


@keyframes cmLoadingSlide {

  from {

    opacity: 0;

    transform:
      translateY(-10px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* =====================================================
   STATISTICS
===================================================== */

#computerManagementPage .stats-grid {

  display: grid;

  grid-template-columns:
    repeat(5, minmax(180px, 1fr));

  gap: 18px;

  margin-bottom: 22px;

}


#computerManagementPage .stat-card {

  display: flex;

  align-items: center;

  gap: 15px;

  min-height: 105px;

  padding: 18px;

  background: white;

  border-radius: 14px;

  border: 1px solid #edf0f5;

  box-shadow:
    0 5px 20px rgba(15,23,42,.07);

  transition: 0.25s;

}


#computerManagementPage .stat-card:hover {

  transform: translateY(-4px);

  box-shadow:
    0 12px 30px rgba(15,23,42,.12);

}


#computerManagementPage .stat-icon {

  width: 52px;

  height: 52px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 50%;

  font-size: 21px;

}


#computerManagementPage .stat-content {

  flex: 1;

}


#computerManagementPage .stat-value {

  font-size: 26px;

  font-weight: 700;

  color: #172554;

  margin-bottom: 5px;

}


#computerManagementPage .stat-title {

  font-size: 12px;

  font-weight: 600;

  color: #64748b;

}


/* COLORS */

#computerManagementPage .stat-blue {
  border-left: 4px solid #2563eb;
}

#computerManagementPage .stat-blue .stat-icon {
  background: #dbeafe;
  color: #2563eb;
}


#computerManagementPage .stat-orange {
  border-left: 4px solid #f59e0b;
}

#computerManagementPage .stat-orange .stat-icon {
  background: #fef3c7;
  color: #d97706;
}


#computerManagementPage .stat-purple {
  border-left: 4px solid #8b5cf6;
}

#computerManagementPage .stat-purple .stat-icon {
  background: #ede9fe;
  color: #7c3aed;
}


#computerManagementPage .stat-green {
  border-left: 4px solid #10b981;
}

#computerManagementPage .stat-green .stat-icon {
  background: #d1fae5;
  color: #059669;
}


#computerManagementPage .stat-red {
  border-left: 4px solid #ef4444;
}

#computerManagementPage .stat-red .stat-icon {
  background: #fee2e2;
  color: #dc2626;
}


/* =====================================================
   ANALYTICS
===================================================== */

#computerManagementPage .analytics-grid {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 18px;

  margin-bottom: 22px;

}


#computerManagementPage .analytics-card {

  background: white;

  border-radius: 14px;

  padding: 18px;

  border: 1px solid #edf0f5;

  box-shadow:
    0 5px 18px rgba(15,23,42,.06);

  min-width: 0;

}


#computerManagementPage .analytics-card-wide {

  grid-column: span 2;

}


#computerManagementPage .analytics-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 14px;

}


#computerManagementPage .analytics-header h3 {

  font-size: 15px;

  font-weight: 700;

  color: #1e293b;

  margin-bottom: 4px;

}


#computerManagementPage .analytics-header p {

  font-size: 11px;

  color: #94a3b8;

}


#computerManagementPage .analytics-icon {

  width: 35px;

  height: 35px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 9px;

  background: #eff6ff;

  color: #2563eb;

}


#computerManagementPage .chart-container,
#computerManagementPage .building-chart-container {

  position: relative;

  width: 100%;

  height: 250px;

}


/* =====================================================
   FILTER
===================================================== */

#computerManagementPage .filter-card {

  background: white;

  border-radius: 14px;

  padding: 20px;

  margin-bottom: 22px;

  border: 1px solid #edf0f5;

  box-shadow:
    0 5px 18px rgba(15,23,42,.06);

}


#computerManagementPage .filter-header {

  margin-bottom: 18px;

}


#computerManagementPage .filter-title {

  display: flex;

  align-items: center;

  gap: 9px;

  font-size: 16px;

  font-weight: 700;

  color: #1e293b;

}


#computerManagementPage .filter-title i {

  color: #2563eb;

}


#computerManagementPage .filter-grid {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(170px, 1fr));

  gap: 14px;

}


#computerManagementPage .filter-field {

  display: flex;

  flex-direction: column;

  gap: 6px;

}


#computerManagementPage .filter-field label {

  font-size: 11px;

  font-weight: 700;

  color: #64748b;

}


#computerManagementPage .filter-field input,
#computerManagementPage .filter-field select {

  width: 100%;

  height: 40px;

  padding: 0 12px;

  border-radius: 8px;

  border: 1px solid #dbe1ea;

  background: #fff;

  color: #334155;

  font-size: 13px;

  outline: none;

}


#computerManagementPage .filter-field input:focus,
#computerManagementPage .filter-field select:focus {

  border-color: #2563eb;

  box-shadow:
    0 0 0 3px rgba(37,99,235,.1);

}


#computerManagementPage .search-input-wrapper {

  position: relative;

}


#computerManagementPage .search-input-wrapper i {

  position: absolute;

  top: 50%;

  left: 12px;

  transform: translateY(-50%);

  color: #94a3b8;

  font-size: 13px;

}


#computerManagementPage .search-input-wrapper input {

  padding-left: 36px;

}


/* BUTTONS */

#computerManagementPage .filter-buttons {

  display: flex;

  justify-content: flex-end;

  gap: 10px;

  margin-top: 20px;

}


#computerManagementPage button {

  font-family: inherit;

  cursor: pointer;

}


#computerManagementPage .btn-primary,
#computerManagementPage .btn-secondary {

  border: none;

  border-radius: 8px;

  padding: 10px 18px;

  font-size: 13px;

  font-weight: 600;

}


#computerManagementPage .btn-primary {

  background: #1d4ed8;

  color: white;

}


#computerManagementPage .btn-primary:hover {

  background: #1e40af;

}


#computerManagementPage .btn-secondary {

  background: #f1f5f9;

  color: #475569;

}


#computerManagementPage .btn-secondary:hover {

  background: #e2e8f0;

}


/* =====================================================
   WORKSPACE
===================================================== */

#computerManagementPage .cm-main-workspace {

  display: grid;

  grid-template-columns: minmax(0, 1fr);

  gap: 20px;

  align-items: start;

}


#computerManagementPage .cm-main-workspace.panel-open {

  grid-template-columns:
    minmax(0, 1fr) 360px;

}


/* =====================================================
   TABLE
===================================================== */

#computerManagementPage .table-card {

  background: white;

  border-radius: 14px;

  padding: 18px;

  border: 1px solid #edf0f5;

  box-shadow:
    0 5px 18px rgba(15,23,42,.06);

}


#computerManagementPage .table-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 16px;

}


#computerManagementPage .table-header h3 {

  font-size: 16px;

  color: #1e293b;

  margin-bottom: 5px;

}


#computerManagementPage .table-header h3 i {

  color: #2563eb;

  margin-right: 6px;

}


#computerManagementPage #cmComputerCount {

  font-size: 12px;

  color: #64748b;

}


#computerManagementPage .table-wrapper {

  overflow-x: auto;

  width: 100%;

}


#computerManagementPage table {

  width: 100%;

  min-width: 1100px;

  border-collapse: separate;

  border-spacing: 0;

}


#computerManagementPage th {

  background: #172554;

  color: white;

  padding: 13px 12px;

  text-align: left;

  font-size: 11px;

  font-weight: 700;

  white-space: nowrap;

}


#computerManagementPage th:first-child {

  border-radius: 8px 0 0 0;

}


#computerManagementPage th:last-child {

  border-radius: 0 8px 0 0;

}


#computerManagementPage td {

  padding: 12px;

  border-bottom: 1px solid #eef2f7;

  color: #475569;

  font-size: 12px;

  vertical-align: middle;

}


#computerManagementPage #cmComputerTableBody tr {

  cursor: pointer;

  transition: 0.15s;

}


#computerManagementPage #cmComputerTableBody tr:hover {

  background: #f8fbff;

}


#computerManagementPage #cmComputerTableBody tr.cm-selected-row {

  background: #dbeafe !important;

  box-shadow:
    inset 4px 0 0 #2563eb;

}


#computerManagementPage #cmComputerTableBody tr.cm-selected-row td {

  font-weight: 600;

}


#computerManagementPage .btn-view {

  width: 34px;

  height: 32px;

  border: none;

  border-radius: 7px;

  background: #2563eb;

  color: white;

}


#computerManagementPage .btn-view:hover {

  background: #1d4ed8;

}


#computerManagementPage .empty-message {

  text-align: center;

  padding: 40px;

  color: #94a3b8;

}


/* =====================================================
   DETAILS PANEL
===================================================== */

#computerManagementPage .cm-details-panel {

  display: none;

  background: white;

  border-radius: 14px;

  border: 1px solid #edf0f5;

  box-shadow:
    0 5px 20px rgba(15,23,42,.08);

  position: sticky;

  top: 15px;

  max-height: calc(100vh - 30px);

  overflow-y: auto;

}


#computerManagementPage .cm-details-panel-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 18px;

  border-bottom: 1px solid #edf0f5;

}


#computerManagementPage .cm-panel-title-small {

  font-size: 9px;

  font-weight: 700;

  letter-spacing: 1px;

  color: #94a3b8;

  margin-bottom: 5px;

}


#computerManagementPage .cm-details-panel-header h3 {

  font-size: 15px;

  color: #172554;

}


#computerManagementPage .cm-details-panel-header button {

  border: none;

  background: transparent;

  font-size: 26px;

  color: #64748b;

}


#computerManagementPage .cm-details-panel-header button:hover {

  color: #dc2626;

}


#computerManagementPage #cmDetailsPanelContent {

  padding: 14px;

}


/* DETAIL SECTIONS */

#computerManagementPage .cm-detail-section {

  background: #fff;

  border: 1px solid #e8edf3;

  border-radius: 10px;

  margin-bottom: 13px;

  overflow: hidden;

}


#computerManagementPage .cm-detail-section-title {

  padding: 10px 12px;

  background: #f8fafc;

  color: #1e3a8a;

  font-size: 12px;

  font-weight: 700;

  border-bottom: 1px solid #edf0f5;

}


#computerManagementPage .cm-detail-row {

  display: grid;

  grid-template-columns: 110px 1fr;

  gap: 10px;

  padding: 9px 12px;

  border-bottom: 1px solid #f1f5f9;

}


#computerManagementPage .cm-detail-row:last-child {

  border-bottom: none;

}


#computerManagementPage .cm-detail-label {

  font-size: 10px;

  font-weight: 700;

  color: #94a3b8;

}


#computerManagementPage .cm-detail-value {

  font-size: 11px;

  font-weight: 600;

  color: #334155;

  word-break: break-word;

}


/* NO SELECTION */

#computerManagementPage .cm-no-selection {

  text-align: center;

  padding: 50px 20px;

  color: #64748b;

}


#computerManagementPage .cm-no-selection-icon {

  width: 65px;

  height: 65px;

  display: flex;

  align-items: center;

  justify-content: center;

  margin: auto auto 15px;

  border-radius: 50%;

  background: #eff6ff;

  color: #2563eb;

  font-size: 26px;

}


#computerManagementPage .cm-no-selection h4 {

  margin-bottom: 8px;

  color: #334155;

}


#computerManagementPage .cm-no-selection p {

  font-size: 12px;

  line-height: 1.6;

}


/* =====================================================
   ERROR
===================================================== */

#computerManagementPage #cmErrorBox {

  display: none;

  background: #fef2f2;

  border: 1px solid #fecaca;

  color: #b91c1c;

  padding: 14px;

  border-radius: 10px;

  margin-bottom: 18px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1500px) {

  #computerManagementPage .stats-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  #computerManagementPage .analytics-grid {
    grid-template-columns: repeat(2, 1fr);
  }

}


@media (max-width: 1200px) {

  #computerManagementPage .filter-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  #computerManagementPage .cm-main-workspace,
  #computerManagementPage .cm-main-workspace.panel-open {
    grid-template-columns: 1fr;
  }

  #computerManagementPage .cm-details-panel {
    position: relative;
    top: auto;
    max-height: none;
  }

}


@media (max-width: 900px) {

  #computerManagementPage .analytics-grid {
    grid-template-columns: 1fr;
  }

  #computerManagementPage .analytics-card-wide {
    grid-column: span 1;
  }

  #computerManagementPage .filter-grid {
    grid-template-columns: repeat(2, 1fr);
  }

}


@media (max-width: 650px) {

  #computerManagementPage .computer-management-container {
    padding: 12px;
  }

  #computerManagementPage .cm-page-top {
    flex-direction: column;
    align-items: flex-start;
  }

  #computerManagementPage .stats-grid {
    grid-template-columns: 1fr;
  }

  #computerManagementPage .filter-grid {
    grid-template-columns: 1fr;
  }

  #computerManagementPage .filter-buttons {
    justify-content: stretch;
  }

  #computerManagementPage .filter-buttons button {
    flex: 1;
  }

  #computerManagementPage .cm-detail-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }

}
</style>
