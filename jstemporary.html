/* =====================================================

/* =====================================================
   SESSION TOKEN
===================================================== */

function cmGetSessionTokenFromBrowser() {

  const possibleKeys = [
    "sessionToken",
    "SESSION_TOKEN",
    "token",
    "userSessionToken"
  ];

  for (let i = 0; i < possibleKeys.length; i++) {

    const key = possibleKeys[i];

    let token = sessionStorage.getItem(key);

    if (!token) {
      token = localStorage.getItem(key);
    }

    if (token) {
      return token;
    }

  }

  return "";
}


/* =====================================================
   INITIALIZE
===================================================== */

function cmInitializeComputerManagement() {

  CM_SESSION_TOKEN =
    cmGetSessionTokenFromBrowser();

  if (!CM_SESSION_TOKEN) {

    cmShowError(

cmRenderAnalyticsCharts(

}


/* =====================================================
   APPS SCRIPT WRAPPER
===================================================== */

function cmCallAppsScript(functionName, args) {

  return new Promise(
    function(resolve, reject) {

      const runner =
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject);

      runner[functionName](...args);

    }
  );

}


/* =====================================================
   POPULATE FILTERS
===================================================== */

    "cmCpuBrandFilter",

    "cmProcessorFilter",
    filters.processors
  );

  cmPopulateSelect(
    "cmRamFilter",
    filters.ramOptions

  cmPopulateSelect(
    "cmStorageFilter",
    filters.primaryStorageOptions

  cmPopulateSelect(
    "cmGraphicCardFilter",
    filters.graphicCards

  cmPopulateSelect(

}


function cmPopulateSelect(id, values) {

  const select =
    document.getElementById(id);

  if (!select) {
    return;
  }

  values = values || [];

  values.forEach(function(value) {

    const option =
      document.createElement("option");

    option.value = value;
    option.textContent = value;

    select.appendChild(option);

  });

}

`;

function cmDetailRow(label, value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    value = "-";

  }


  return `

    <div class="cm-detail-row">

      <div class="cm-detail-label">
        ${cmEscapeHtml(label)}
      </div>

      <div class="cm-detail-value">
        ${cmEscapeHtml(value)}
      </div>

    </div>

  `;

}


/* =====================================================
   FORMAT DETAIL VALUE
===================================================== */

function cmFormatDetailValue(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }

  const text =
    String(value);


  if (
    text.startsWith("http://") ||
    text.startsWith("https://")
  ) {

    return `
      <a
        href="${cmEscapeAttribute(text)}"
        target="_blank"
      >
        Open Link
      </a>
    `;

  }

  return cmEscapeHtml(text);

}


/* =====================================================
   CLOSE MODAL
===================================================== */

  document.getElementById(
    "cmComputerModal"
  ).style.display = "none";

}


/* =====================================================
   RENDER SUMMARY
===================================================== */

function cmRenderSummary(
  containerId,
  data,
  labelKey
) {

  const container =
    document.getElementById(
      containerId
    );

  if (!container) {
    return;
  }

  container.innerHTML = "";

  if (!data || data.length === 0) {

    container.innerHTML =
      "<div class='empty-message'>No data available</div>";

    return;

  }

  data.forEach(
    function(item) {

      const div =
        document.createElement("div");

      div.className =
        "summary-item";

      div.innerHTML = `

        <span>
          ${cmEscapeHtml(
            item[labelKey] || "Unknown"
          )}
        </span>

        <span class="summary-count">
          ${item.count}
        </span>

      `;

      container.appendChild(div);

    }
  );

}


/* =====================================================
   LOADING
===================================================== */

}


function cmHideLoading() {

  const overlay =
    document.getElementById(
      "cmLoadingOverlay"
    );

  if (overlay) {

    overlay.style.display =
      "none";

  }

}


/* =====================================================
   ERROR
===================================================== */

function cmShowError(message) {

  const errorBox =
    document.getElementById(
      "cmErrorBox"
    );

  errorBox.textContent = message;

  errorBox.style.display = "block";

  console.error(message);

  setTimeout(
    function() {

      errorBox.style.display = "none";

    },
    7000
  );

}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function cmEscapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;

}


function cmEscapeAttribute(value) {

  return cmEscapeHtml(value)

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

===================================================== */

function cmGetChartColors(count) {

  const colors = [

    "#2563eb",
    "#10b981",
    "#f59e0b",
    "#8b5cf6",
    "#ef4444",
    "#06b6d4",
    "#ec4899",
    "#84cc16",
    "#f97316",
    "#6366f1",
    "#14b8a6",
    "#a855f7"

  ];


  const result = [];


  for (
    let i = 0;
    i < count;
    i++
  ) {

    result.push(
      colors[i % colors.length]
    );

  }


  return result;

}
function cmRenderBuildingChart(data) {

  const canvas =
    document.getElementById(
      "cmBuildingChart"
    );


  if (!canvas) {
    return;
  }


  if (cmBuildingChart) {

    cmBuildingChart.destroy();

  }


  data = data || [];


  const topData =
    data.slice(0, 10);


  cmBuildingChart =
    new Chart(
      canvas,
      {

        type:
          "bar",

        data: {

          labels:
            topData.map(
              item => item.building
            ),

          datasets: [

            {

              label:
                "Computers",

              data:
                topData.map(
                  item => item.count
                ),

              backgroundColor:
                "#2563eb",

              borderRadius:
                6,

              borderSkipped:
                false

            }

          ]

        },


        options: {

          responsive:
            true,

          maintainAspectRatio:
            false,

          indexAxis:
            "y",

          plugins: {

            legend: {

              display:
                false

            }

          },


          scales: {

            x: {

              beginAtZero:
                true,

              grid: {

                color:
                  "#edf1f5"

              }

            },


            y: {

              grid: {

                display:
                  false

              }

            }

          }

        }

      }
    );

}
function cmRenderDonutChart(
  existingChart,
  canvasId,
  data,
  labelKey
) {

  const canvas =
    document.getElementById(canvasId);

  if (!canvas) {
    return null;
  }


  /* Destroy previous chart */

  if (
    existingChart &&
    typeof existingChart.destroy === "function"
  ) {

    existingChart.destroy();

  }


  data =
    Array.isArray(data)
      ? data
      : [];


  /* Original complete data */

  const originalLabels =
    data.map(function(item) {

      return item[labelKey] || "Unknown";

    });


  const originalValues =
    data.map(function(item) {

      return Number(item.count) || 0;

    });


  const originalColors =
    cmGetChartColors(data.length);


  /*
    Store selected item.

    null = show all
  */

  let selectedIndex = null;


  /*
    Restore all chart data
  */

  function showAll(chart) {

    selectedIndex = null;

    chart.data.labels =
      [...originalLabels];

    chart.data.datasets[0].data =
      [...originalValues];

    chart.data.datasets[0].backgroundColor =
      [...originalColors];

    chart.update();

  }


  /*
    Show only selected item
  */

  function showOnly(chart, index) {

    selectedIndex = index;

    chart.data.labels = [
      originalLabels[index]
    ];

    chart.data.datasets[0].data = [
      originalValues[index]
    ];

    chart.data.datasets[0].backgroundColor = [
      originalColors[index]
    ];

    chart.update();

  }


  /*
    Handle selection
  */

  function handleSelection(chart, index) {

    /*
      If already showing only one item,
      clicking again restores all
    */

    if (
      selectedIndex !== null &&
      selectedIndex === index
    ) {

      showAll(chart);

      return;

    }


    /*
      If already filtered and click chart,
      restore all
    */

    if (
      selectedIndex !== null &&
      chart.data.labels.length === 1
    ) {

      showAll(chart);

      return;

    }


    /*
      Show selected item only
    */

    showOnly(
      chart,
      index
    );

  }


  const chart =
    new Chart(
      canvas,
      {

        type: "doughnut",


        data: {

          labels:
            [...originalLabels],

          datasets: [

            {

              data:
                [...originalValues],

              backgroundColor:
                [...originalColors],

              borderWidth:
                2,

              borderColor:
                "#ffffff"

            }

          ]

        },


        options: {

          responsive:
            true,

          maintainAspectRatio:
            false,

          cutout:
            "58%",


          /*
            CLICK DONUT PART
          */

          onClick: function(
            event,
            elements,
            chartInstance
          ) {

            if (
              !elements ||
              elements.length === 0
            ) {

              return;

            }


            /*
              If chart currently contains
              only one item, restore all
            */

            if (
              selectedIndex !== null &&
              chartInstance.data.labels.length === 1
            ) {

              showAll(chartInstance);

              return;

            }


            const index =
              elements[0].index;


            handleSelection(
              chartInstance,
              index
            );

          },


          plugins: {

            legend: {

              position:
                "right",


              /*
                CLICK LEGEND
              */

              onClick: function(
                event,
                legendItem,
                legend
              ) {

                const chartInstance =
                  legend.chart;


                /*
                  Find original index
                  using label text
                */

                const index =
                  originalLabels.indexOf(
                    legendItem.text
                  );


                if (
                  index === -1
                ) {

                  return;

                }


                /*
                  If same item selected,
                  restore all
                */

                if (
                  selectedIndex === index
                ) {

                  showAll(chartInstance);

                  return;

                }


                /*
                  Show only selected
                */

                showOnly(
                  chartInstance,
                  index
                );

              },


labels: {

  boxWidth: 10,

  padding: 12,

  font: {

    size: 11

  },

  generateLabels: function(chart) {

    const dataset =
      chart.data.datasets[0];

    return chart.data.labels.map(
      function(label, index) {

        return {

          text:
            label +
            " (" +
            dataset.data[index] +
            ")",

          fillStyle:
            dataset.backgroundColor[index],

          strokeStyle:
            dataset.backgroundColor[index],

          lineWidth: 0,

          hidden: false,

          index: index

        };

      }
    );

  }

}

            },


            tooltip: {

              callbacks: {

                label:
                  function(context) {

                    return (
                      context.label +
                      ": " +
                      context.raw
                    );

                  }

              }

            }

          }

        }

      }
    );


  return chart;

}

function cmDownloadQRCode(
  computerNo,
  qrLink
) {

  computerNo =
    String(computerNo || "").trim();

  qrLink =
    String(qrLink || "").trim();


  /* VALIDATION */

  if (!computerNo) {

    cmShowError(
      "Computer number not found."
    );

    return;

  }


  if (!qrLink) {

    cmShowError(
      "QR link not found."
    );

    return;

  }


  cmShowLoading(
    "Generating QR Code..."
  );


  /*
    CREATE QR URL
  */

  const qrUrl =
    "https://quickchart.io/qr" +
    "?size=1000" +
    "&margin=2" +
    "&ecLevel=M" +
    "&format=png" +
    "&text=" +
    encodeURIComponent(qrLink);


  /*
    DOWNLOAD USING FETCH
  */

  fetch(qrUrl)

    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          "Unable to generate QR code."
        );

      }

      return response.blob();

    })

    .then(function(qrBlob) {

      const qrImage =
        new Image();


      const qrBlobUrl =
        URL.createObjectURL(
          qrBlob
        );


      qrImage.onload =
        function() {

          try {

            const canvas =
              document.createElement(
                "canvas"
              );


            const qrSize =
              1000;


            const headerHeight =
              160;


            canvas.width =
              qrSize;


            canvas.height =
              qrSize +
              headerHeight;


            const ctx =
              canvas.getContext(
                "2d"
              );


            if (!ctx) {

              throw new Error(
                "Unable to create canvas."
              );

            }


            /*
              WHITE BACKGROUND
            */

            ctx.fillStyle =
              "#FFFFFF";


            ctx.fillRect(
              0,
              0,
              canvas.width,
              canvas.height
            );


            /*
              COMPUTER NUMBER
            */

            ctx.fillStyle =
              "#000000";


            ctx.font =
              "bold 52px Arial";


            ctx.textAlign =
              "center";


            ctx.textBaseline =
              "middle";


            ctx.fillText(
              computerNo,
              canvas.width / 2,
              headerHeight / 2
            );


            /*
              DRAW QR CODE
            */

            ctx.drawImage(
              qrImage,
              0,
              headerHeight,
              qrSize,
              qrSize
            );


            /*
              CREATE FINAL PNG
            */

            canvas.toBlob(

              function(finalBlob) {

                if (!finalBlob) {

                  throw new Error(
                    "Unable to create final QR image."
                  );

                }


                const downloadUrl =
                  URL.createObjectURL(
                    finalBlob
                  );


                const downloadLink =
                  document.createElement(
                    "a"
                  );


                downloadLink.href =
                  downloadUrl;


                downloadLink.download =
                  computerNo.replace(
                    /[^a-zA-Z0-9_-]/g,
                    "_"
                  ) +
                  "_QR.png";


                document.body.appendChild(
                  downloadLink
                );


                downloadLink.click();


                downloadLink.remove();


                setTimeout(
                  function() {

                    URL.revokeObjectURL(
                      downloadUrl
                    );

                  },
                  1000
                );


                URL.revokeObjectURL(
                  qrBlobUrl
                );


                cmHideLoading();

              },

              "image/png"

            );

          }

          catch (error) {

            console.error(
              "QR Processing Error:",
              error
            );


            cmHideLoading();


            cmShowError(
              "QR download failed: " +
              error.message
            );

          }

        };


      qrImage.onerror =
        function() {

          URL.revokeObjectURL(
            qrBlobUrl
          );


          cmHideLoading();


          cmShowError(
            "Unable to process QR image."
          );

        };


      qrImage.src =
        qrBlobUrl;

    })

    .catch(function(error) {

      console.error(
        "QR Download Error:",
        error
      );


      cmHideLoading();


      cmShowError(
        "QR download failed: " +
        error.message
      );

    });

}

</script>
